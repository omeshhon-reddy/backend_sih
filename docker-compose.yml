services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: landguard
      POSTGRES_PASSWORD: landguard
      POSTGRES_DB: landguard
    ports:
      - "5432:5432"
    volumes:
      - landguard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landguard -d landguard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  landguard_pg:
